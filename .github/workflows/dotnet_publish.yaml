name: Publish NuGet package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore /home/runner/work/mistralsdk-csharp/mistralsdk-csharp/MistralSdk.slnx

      - name: Pack
        run: dotnet pack /home/runner/work/mistralsdk-csharp/mistralsdk-csharp/csharp/src/MistralSdk/MistralSdk.csproj --configuration Release --no-restore -o /tmp/nupkgs

      - name: Publish
        run: dotnet nuget push "/tmp/nupkgs/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

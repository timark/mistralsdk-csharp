name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore /home/runner/work/mistralsdk-csharp/mistralsdk-csharp/MistralSdk.slnx

      - name: Build
        run: dotnet build /home/runner/work/mistralsdk-csharp/mistralsdk-csharp/MistralSdk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test /home/runner/work/mistralsdk-csharp/mistralsdk-csharp/MistralSdk.slnx --configuration Release --no-build
